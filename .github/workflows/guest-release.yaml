name: Guest release
on:
  push:
    tags:
      - "v*-guest"
permissions:
  contents: read
concurrency:
  group: guest-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'broxcat/headplane'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          cache: pnpm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.2
      - name: Verify annotated tag, exact version and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          node scripts/guest-release.ts verify-tag "$TAG"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: go test ./cmd/hp_agent/... ./cmd/hp_healthcheck/... ./internal/...
      - name: Guest route, SMTP and permission integration tests
        env:
          HP_HEADSCALE_VERSIONS: all
        run: pnpm test:integration tests/integration/headplane/guests.test.ts tests/integration/headplane/guest-invitations.test.ts tests/integration/headplane/guest-mail.test.ts tests/integration/headplane/guest-email-settings.test.ts tests/integration/headplane/permissions.test.ts
      - name: Build and scan the native archive
        run: ./scripts/build-guest.sh dist
      - name: Recheck tag and source after the build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/guest-release.ts verify-tag "$TAG"
          test "$(jq -r .commit dist/release.json)" = "$(git rev-parse "${GITHUB_SHA}^{commit}")"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Extract and run the archive in an isolated container
        env:
          TAG: ${{ github.ref_name }}
        run: HP_GUEST_ARCHIVE="$PWD/dist/headplane-${TAG#v}-linux-amd64.tar.gz" pnpm test:integration tests/integration/headplane/guest-archive.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guest-release
          path: dist/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: guest-release
          path: dist
      - name: Publish a new pre-release, never overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: broxcat/headplane
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          test "$(jq -r .tag release.json)" = "$TAG"
          test "$(jq -r .sourceDirty release.json)" = false
          gh release create "$TAG" --verify-tag --draft --prerelease --latest=false \
            --title "Headplane ${TAG%-guest} — Guest Features" --notes-file RELEASE-NOTES.md \
            ./*.tar.gz SHA256SUMS INSTALL.md RELEASE-NOTES.md release.json THIRD_PARTY_NOTICES.md
          mkdir "$RUNNER_TEMP/downloaded"
          gh release download "$TAG" --dir "$RUNNER_TEMP/downloaded"
          (cd "$RUNNER_TEMP/downloaded" && sha256sum --check SHA256SUMS)
          gh release edit "$TAG" --draft=false --prerelease --latest=false
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
